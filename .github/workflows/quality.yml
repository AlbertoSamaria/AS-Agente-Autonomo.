name: SA Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sa-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-and-js:
    name: PHP 8.2 and JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, zip, dom, curl
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Run automated PHP tests
        run: php tests/run.php

      - name: Check JavaScript syntax
        run: |
          node --check public/assets/app.js
          node --check public/assets/app-v2.js
